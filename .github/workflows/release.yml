name: release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/backend.yml
  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check version bump
        run: |
          TAG=$(git describe --tags --match "[0-9]*.[0-9]*.[0-9]*" --abbrev=8)
          VERSION=$(grep project CMakeLists.txt| awk '{print $3}')
          if [ "$TAG" != "$VERSION" ]; then
            echo "=== Version in CMakeLists.txt and git tag does not match!"
            echo "=== Git Tag: $TAG, Version: $VERSION"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        
      - run: |
          mkdir build
          for file in ttyd.*/*; do
            artifact="${file%%/*}"
            name="$(basename "$file")"
            case "$name" in
              ttyd.exe)
                target="${artifact}.exe"
                ;;
              ttyd.dll)
                target="${artifact}"
                ;;
              ttyd.lib)
                target="${artifact%.dll}.lib"
                ;;
              libttyd.so|libttyd.dylib)
                target="${artifact}"
                ;;
              ttyd)
                target="${artifact}"
                ;;
              *)
                target="${artifact}.${name}"
                ;;
            esac
            mv "$file" "build/$target"
          done
          pushd build; sha256sum ttyd.* > SHA256SUMS; popd
      - uses: ncipollo/release-action@v1
        with:
          artifacts: build/*
          allowUpdates: true
          draft: true
