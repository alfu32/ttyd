name: docker

on:
  push:
    branches: main
    tags: ["*"]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    env:
      DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      DOCKER_HUB_REPOSITORY: ${{ secrets.DOCKER_HUB_REPOSITORY }}
    steps:
      - uses: actions/checkout@v6
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential cmake curl file libtool
      - name: Cross build multi-arch binary
        run: |
          mkdir dist
          for arch in amd64 armv7 arm64 s390x; do
            env BUILD_TARGET=$arch ./scripts/cross-build.sh
            [ "$arch" = "armv7" ] && arch="arm" 
            mkdir -p dist/$arch && cp build/ttyd dist/$arch/ttyd
          done
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: ${{ env.DOCKER_HUB_USER != '' && env.DOCKER_HUB_TOKEN != '' }}
        with:
          username: ${{ env.DOCKER_HUB_USER }}
          password: ${{ env.DOCKER_HUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine docker tags
        id: docker_tag
        run: |
          REPO="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          GHCR_IMAGE="ghcr.io/${REPO}"
          DOCKER_HUB_IMAGE="${DOCKER_HUB_REPOSITORY:-${DOCKER_HUB_USER}/ttyd}"
          case $GITHUB_REF in
            refs/tags/*)
              TAG_NAME=${GITHUB_REF#refs/tags/}
              IMAGE_TAG="${TAG_NAME}"
              ALPINE_IMAGE_TAG="${TAG_NAME}-alpine"
              ;;
            *)
              IMAGE_TAG="latest"
              ALPINE_IMAGE_TAG="alpine"
          esac

          {
            echo "DOCKER_TAGS<<EOF"
            echo "${GHCR_IMAGE}:${IMAGE_TAG}"
            if [ -n "$DOCKER_HUB_USER" ] && [ -n "$DOCKER_HUB_TOKEN" ]; then
              echo "${DOCKER_HUB_IMAGE}:${IMAGE_TAG}"
            fi
            echo "EOF"
            echo "ALPINE_TAGS<<EOF"
            echo "${GHCR_IMAGE}:${ALPINE_IMAGE_TAG}"
            if [ -n "$DOCKER_HUB_USER" ] && [ -n "$DOCKER_HUB_TOKEN" ]; then
              echo "${DOCKER_HUB_IMAGE}:${ALPINE_IMAGE_TAG}"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"
      - name: build/push docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64,linux/s390x
          push: true
          tags: ${{ env.DOCKER_TAGS }}
      - name: build/push docker image (alpine)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.alpine
          platforms: linux/amd64,linux/arm/v7,linux/arm64,linux/s390x
          push: true
          tags: ${{ env.ALPINE_TAGS }}
