name: backend

on:
  push:
    paths:
    - ".github/workflows/backend.yml"
    - "CMakeLists.txt"
    - "src/*"
    - "scripts/*"
  pull_request:
    paths:
    - ".github/workflows/backend.yml"
    - "CMakeLists.txt"
    - "src/*"
    - "scripts/*"
  workflow_call:

jobs:
  msvc:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_EXE: ${{ github.workspace }}/vcpkg/vcpkg.exe
      VCPKG_TRIPLET: x64-windows-static
      TOOLCHAIN_FILE: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
    steps:
      - uses: actions/checkout@v6
      - name: Checkout vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          path: vcpkg
      - name: Bootstrap vcpkg
        shell: pwsh
        run: ${{ github.workspace }}/vcpkg/bootstrap-vcpkg.bat
      - name: Install dependencies
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "${{ env.VCPKG_ROOT }}"
          ${{ env.VCPKG_EXE }} install --triplet ${{ env.VCPKG_TRIPLET }} libwebsockets libuv json-c zlib openssl getopt-win32
      - name: Build with MSVC
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "${{ env.VCPKG_ROOT }}"
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="${{ env.TOOLCHAIN_FILE }}" -DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_TRIPLET }} -DTTYD_BUILD_SHARED=ON
          cmake --build build --config Release
      - uses: actions/upload-artifact@v7
        with:
          name: ttyd.msvc
          path: build/Release/ttyd.exe
      - uses: actions/upload-artifact@v7
        with:
          name: ttyd.msvc.dll
          path: |
            build/Release/ttyd.dll
            build/Release/ttyd.lib
  linux-shared:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl libuv1-dev libjson-c-dev zlib1g-dev libssl-dev
      - name: Build PIC libwebsockets
        run: |
          curl -fSsLo- https://github.com/warmcat/libwebsockets/archive/v4.5.7.tar.gz | tar xz -C "$RUNNER_TEMP"
          sed -i 's/ websockets_shared//g' "$RUNNER_TEMP/libwebsockets-4.5.7/cmake/libwebsockets-config.cmake.in"
          cmake -S "$RUNNER_TEMP/libwebsockets-4.5.7" -B "$RUNNER_TEMP/libwebsockets-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/libwebsockets-stage" \
            -DLWS_WITHOUT_TESTAPPS=ON \
            -DLWS_WITH_SSL=ON \
            -DLWS_WITH_LIBUV=ON \
            -DLWS_STATIC_PIC=ON \
            -DLWS_WITH_STATIC=ON \
            -DLWS_WITH_SHARED=OFF \
            -DLWS_UNIX_SOCK=ON \
            -DLWS_IPV6=ON \
            -DLWS_ROLE_RAW_FILE=OFF \
            -DLWS_WITH_HTTP2=ON \
            -DLWS_WITH_HTTP_BASIC_AUTH=OFF \
            -DLWS_WITH_HTTP_STREAM_COMPRESSION=ON \
            -DLWS_WITH_UDP=OFF \
            -DLWS_WITHOUT_CLIENT=ON \
            -DLWS_WITHOUT_EXTENSIONS=OFF \
            -DLWS_WITH_LEJP=OFF \
            -DLWS_WITH_LEJP_CONF=OFF \
            -DLWS_WITH_LWSAC=OFF \
            -DLWS_WITH_SEQUENCER=OFF \
            -DLWS_WITH_UPNG=OFF \
            -DLWS_WITH_JPEG=OFF \
            -DLWS_WITH_DLO=OFF \
            -DLWS_WITH_SYS_STATE=OFF \
            -DLWS_WITH_SYS_SMD=OFF \
            -DLWS_WITH_SECURE_STREAMS=OFF \
            -DLWS_CTEST_INTERNET_AVAILABLE=OFF
          cmake --build "$RUNNER_TEMP/libwebsockets-build" --target install --config Release
      - name: Build shared library
        run: |
          LWS_DIR="$(find "$RUNNER_TEMP/libwebsockets-stage" -name libwebsockets-config.cmake -printf '%h\n' -quit)"
          test -n "$LWS_DIR"
          cmake -S . -B build-shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DTTYD_BUILD_SHARED=ON \
            -DLibwebsockets_DIR="$LWS_DIR"
          cmake --build build-shared --target ttyd_shared --config Release
      - uses: actions/upload-artifact@v7
        with:
          name: ttyd.linux.so
          path: build-shared/libttyd.so
  macos-shared:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install packages
        run: |
          brew update
          brew install cmake libuv libwebsockets json-c zlib openssl@3
      - name: Build shared library
        run: |
          cmake -S . -B build-shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DTTYD_BUILD_SHARED=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix libuv);$(brew --prefix libwebsockets);$(brew --prefix json-c);$(brew --prefix zlib);$(brew --prefix openssl@3)"
          cmake --build build-shared --target ttyd_shared --config Release
      - uses: actions/upload-artifact@v7
        with:
          name: ttyd.macos.dylib
          path: build-shared/libttyd.dylib
  cross:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [i686, x86_64, arm, armhf, aarch64, mips, mipsel, mips64, mips64el, ppc64, ppc64le, s390x, win32]
    steps:
      - uses: actions/checkout@v6
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential cmake curl file libtool
      - name: Cross build (${{ matrix.target }})
        env:
          BUILD_TARGET: ${{ matrix.target }}
          TTYD_BUILD_SHARED: OFF
        run: ./scripts/cross-build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ttyd.${{ matrix.target }}
          path: build/ttyd*
