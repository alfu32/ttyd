name: lib-release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/backend.yml
    with:
      build_mode: libraries
  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check release tag
        run: |
          TAG=$(git describe --tags --exact-match --match "[0-9]*.[0-9]*.[0-9]*" HEAD)
          VERSION=$(grep project CMakeLists.txt| awk '{print $3}')
          if [ "$TAG" != "$VERSION" ]; then
            echo "=== Version in CMakeLists.txt and git tag does not match!"
            echo "=== Git Tag: $TAG, Version: $VERSION"
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
      - name: Prepare library artifacts
        run: |
          mkdir build
          for file in ttyd.*/*; do
            artifact="${file%%/*}"
            name="$(basename "$file")"
            case "$name" in
              ttyd.dll)
                target="${artifact}"
                ;;
              ttyd.lib)
                target="${artifact%.dll}.lib"
                ;;
              libttyd.so|libttyd.dylib)
                target="${artifact}"
                ;;
              *)
                target="${artifact}.${name}"
                ;;
            esac
            mv "$file" "build/$target"
          done
          pushd build; sha256sum ttyd.* > SHA256SUMS; popd
      - uses: ncipollo/release-action@v1
        with:
          artifacts: build/*
          allowUpdates: true
          draft: true
          tag: ${{ env.RELEASE_TAG }}
